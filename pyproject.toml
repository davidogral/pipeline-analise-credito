[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-pipeline"
version = "1.0.0"
description = "Pipeline de dados de análise de crédito em PySpark com arquitetura medalhão, quality gate, PostgreSQL e Airflow"
readme = "README.md"
requires-python = ">=3.10"
# PySpark e psycopg2 ficam em extras: o Databricks já fornece o Spark, e o psycopg2-binary
# (que embute o próprio OpenSSL) derruba o processo Python no compute serverless.
dependencies = [
    "pyarrow>=12",
    "pandas>=1.5,<3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pyspark>=3.5,<4", "psycopg2-binary>=2.9", "delta-spark>=3.1,<4", "pytest>=8", "ruff>=0.6"]
notebook = ["pyspark>=3.5,<4", "jupyter", "seaborn>=0.13", "scikit-learn>=1.4"]

[project.scripts]
credit-pipeline = "credit_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: testes que precisam de um PostgreSQL rodando"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
