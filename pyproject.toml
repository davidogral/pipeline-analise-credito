[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-pipeline"
version = "1.0.0"
description = "Pipeline de dados de análise de crédito em PySpark com arquitetura medalhão, quality gate, PostgreSQL e Airflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<4",
    "pyarrow>=14",
    "pandas>=2.1,<3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = ["jupyter", "seaborn>=0.13", "scikit-learn>=1.4"]

[project.scripts]
credit-pipeline = "credit_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: testes que precisam de um PostgreSQL rodando"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
