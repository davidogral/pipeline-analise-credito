name: CI

on:
  push:
    branches: [main, spark]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipeline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: pipeline
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests dags

      - name: Testes (unitários, ponta a ponta e integração com PostgreSQL)
        run: pytest -v

      - name: Pipeline completo
        run: |
          credit-pipeline run
          credit-pipeline analytics --engine postgres
          credit-pipeline ml
