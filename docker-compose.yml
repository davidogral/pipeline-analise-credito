services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-pipeline-db
    environment:
      POSTGRES_DB: ${PGDATABASE:-pipeline}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-pipeline}"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5-python3.11
    container_name: credit-pipeline-airflow
    profiles: ["airflow"]
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: /opt/project
      PIPELINE_DATA_DIR: /opt/project/data
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-pipeline}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/project

volumes:
  pgdata:
